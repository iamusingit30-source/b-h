<style>
:root{--bg:#fff1f5;--ink:#4a2735;--pink:#ff7aa2;--rose:#e8456f;--card:#fff;--soft:#ffd6e3;--lav:#e6dcff;--serif:"Lora",Georgia,serif;--sans:"Fredoka","Trebuchet MS",system-ui,sans-serif;--hand:"Caveat","Segoe Script",cursive}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:18px;line-height:1.5;transition:background 2.5s;overflow-x:hidden}
body.calm{background:#fbf3e8}
section{max-width:760px;margin:0 auto;padding:72px 20px;text-align:center;transition:opacity 2.5s}
body.calm .playful{opacity:.12;pointer-events:none}
h1,h2{font-family:var(--sans);font-weight:600;line-height:1.15;margin:0 0 18px}
h1{font-size:clamp(34px,8vw,60px);color:var(--rose)}
h2{font-size:clamp(24px,5.5vw,36px)}
p{margin:0 0 14px}
.sub{font-size:1.1em}
button{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:999px;padding:12px 24px;margin:6px;background:var(--pink);color:#fff;box-shadow:0 4px 0 #c9507a;transition:transform .15s}
button:hover{transform:translateY(-2px) rotate(-1deg)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #c9507a}
button.alt{background:var(--lav);color:var(--ink);box-shadow:0 4px 0 #b9a8e8}
button:focus-visible,.env:focus-visible,.card:focus-visible,.polaroid:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.reply{font-family:var(--hand);font-size:1.7em;color:var(--rose);min-height:1.2em;margin:12px 0;animation:pop .4s}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
#hearts{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#hearts span{position:absolute;bottom:-40px;animation:rise linear infinite;opacity:.5}
body.calm #hearts{opacity:0;transition:opacity 2s}
@keyframes rise{to{transform:translateY(-115vh) rotate(25deg)}}
main{position:relative;z-index:1}
.widgets{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px;max-width:760px;margin:0 auto;text-align:center}
.w{background:var(--card);border-radius:22px;padding:18px 16px;width:100%;box-shadow:0 8px 24px #e8456f22;transition:opacity 2.5s}
body.calm .w{opacity:.12;pointer-events:none}
.opts{display:flex;flex-direction:column;align-items:center}
.opts button{max-width:100%}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:22px;margin-top:20px}
.polaroid{background:#fff;padding:10px 10px 36px;width:200px;box-shadow:0 6px 18px #0002;cursor:pointer;border:0;border-radius:2px;transition:transform .2s;font:inherit;color:inherit;position:relative}
.polaroid:nth-child(odd){transform:rotate(-3deg)}.polaroid:nth-child(even){transform:rotate(2.5deg)}.polaroid:nth-child(3n){transform:rotate(-1deg)}
.polaroid:hover{transform:scale(1.05) rotate(0)}
.ph{width:100%;aspect-ratio:1;object-fit:cover;display:grid;place-items:center;font-size:56px;background:linear-gradient(135deg,var(--soft),var(--lav))}
.polaroid .cap{font-family:var(--hand);font-size:1.15em;position:absolute;bottom:6px;left:0;right:0}
dialog{border:0;border-radius:6px;padding:14px 14px 20px;max-width:min(92vw,520px);box-shadow:0 20px 60px #0006;text-align:center}
dialog::backdrop{background:#2a101acc}
dialog .ph{font-size:110px}
dialog img.ph,dialog video.ph{max-height:70vh;aspect-ratio:auto;width:100%;background:#000}
dialog p{font-family:var(--hand);font-size:1.6em;margin:12px 0 4px}
.tabs{display:flex;flex-wrap:wrap;justify-content:center;margin:8px 0 14px}
.tab.on{background:var(--rose);color:#fff;box-shadow:0 4px 0 #a82f50}
.goofy{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px;margin:24px 0 8px}
.gf{border:0;background:#fff;border-radius:18px;padding:8px 8px 10px;font:inherit;color:inherit;cursor:pointer;box-shadow:0 6px 14px #e8456f22;position:relative;transform:rotate(var(--r,0deg));transition:transform .25s}
.gf:hover{transform:rotate(0) scale(1.05)}
.gf::before{content:"";position:absolute;top:-9px;left:50%;width:56px;height:16px;margin-left:-28px;background:#ffd23fa8;transform:rotate(-4deg)}
.gf .ph{border-radius:12px;font-size:48px}
.gf .lvl{display:block;margin-top:6px;font-size:.85em}
.gf .cap{display:none;font-family:var(--hand);font-size:1.3em;line-height:1.1;margin-top:4px}
.gf.open .cap{display:block;animation:pop .3s}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:20px}
.env{background:var(--soft);border-radius:10px;padding:26px 14px;cursor:pointer;border:0;font:inherit;color:inherit;font-weight:600;position:relative;box-shadow:0 6px 14px #e8456f22;text-align:center}
.env::before{content:"💌";display:block;font-size:40px;transition:transform .4s}
.env.open::before{transform:translateY(-6px) rotate(-12deg) scale(1.2)}
.env .msg{display:none;font-weight:400;white-space:pre-line;margin-top:12px;text-align:left;font-size:.95em}
.env.open .msg{display:block;animation:pop .5s}
.card{background:#fff;border:2px dashed var(--pink);border-radius:18px;padding:18px 12px;cursor:pointer;font:inherit;color:inherit;font-weight:600}
.card .msg{display:none;font-weight:400;margin-top:8px;white-space:pre-line}
.card.open{background:var(--soft);border-style:solid}.card.open .msg{display:block;animation:pop .4s}
.card.big{grid-column:1/-1;background:var(--rose);color:#fff;border-color:var(--rose)}
.meter{height:30px;background:#fff;border-radius:99px;overflow:hidden;border:3px solid var(--pink);margin:20px auto;max-width:520px}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--rose));transition:width .3s}
.meter.hot i{background:repeating-linear-gradient(45deg,#e8456f,#e8456f 10px,#ffb020 10px,#ffb020 20px)}
.pct{font-size:3em;font-weight:600;color:var(--rose)}
.shake{animation:shake .25s infinite}
@keyframes shake{25%{transform:translate(2px,-2px)}75%{transform:translate(-2px,2px)}}
.cake{width:200px;margin:30px auto 10px;position:relative}
.candles{display:flex;justify-content:center;gap:22px;height:64px;align-items:flex-end}
.candle{width:10px;height:36px;background:repeating-linear-gradient(#fff 0 6px,var(--pink) 6px 12px);border-radius:3px;position:relative}
.flame{position:absolute;top:-24px;left:-3px;width:16px;height:22px;background:radial-gradient(#fff 10%,#ffd23f 45%,#ff8a1f);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;transition:opacity .4s,transform .4s;transform-origin:bottom;animation:fl .5s infinite alternate}
@keyframes fl{to{transform:scale(1.1,.92) rotate(3deg)}}
.out .flame{opacity:0;transform:scale(0);animation:none}
.tier1{height:50px;background:#ffb8cf;border-radius:10px 10px 0 0;border-top:12px solid #fff}
.tier2{height:60px;background:#ff8fb3;border-radius:0 0 12px 12px;width:116%;margin-left:-8%}
.conf{position:fixed;top:-20px;z-index:50;pointer-events:none;animation:fall 3s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
#trans{min-height:90vh;display:flex;flex-direction:column;justify-content:center;align-items:center}
#trans .line{font-family:var(--serif);font-size:1.5em;opacity:0;transition:opacity 1.8s;margin-bottom:20px}
#trans .line.show{opacity:1}
#trans button{opacity:0;transition:opacity 1.8s;background:#c98a6b;box-shadow:0 4px 0 #9d6247}
#trans button.show{opacity:1}
#letter,#final{display:none}
body.letter #main{display:none}body.letter #letter{display:block}
.letter-photos{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;margin:8px 0 1.2em}
.letter-photo{width:min(100%,220px);margin:0;padding:10px 10px 34px;background:#fff;box-shadow:0 6px 18px #0002;transform:rotate(-2deg)}
.letter-photo:nth-child(even){transform:rotate(2deg)}
.letter-photo img,.letter-photo .placeholder{display:grid;place-items:center;width:100%;aspect-ratio:1;object-fit:cover;background:linear-gradient(135deg,var(--soft),var(--lav))}
.letter-photo .placeholder{font-family:var(--hand);font-size:1.2em;text-align:center;padding:12px}
.letter-photo figcaption{margin-top:5px;text-align:center;font-family:var(--hand);font-size:1.2em}
.sign{text-align:center;margin-top:26px;color:#a86a58;font-size:.9em}
#final{text-align:center;font-family:var(--serif)}
#final button{background:#c98a6b;box-shadow:0 4px 0 #9d6247;font-family:var(--sans)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
/* ===== Beautiful letter ===== */
body.letter{background:radial-gradient(circle at 15% 0%,#ffe0ea 0,transparent 45%),radial-gradient(circle at 90% 35%,#ece1ff 0,transparent 40%),#fff4ee}
body.letter #hearts{display:block;opacity:.35}

.paper{position:relative;max-width:680px;margin:34px auto 0;padding:80px 40px 56px;background:linear-gradient(#fffdf8,#fff5e8);border:1px solid #ecd5bd;border-radius:10px;box-shadow:0 24px 60px #b0647e2e,0 4px 14px #8a5a3a1a;font-family:"Cormorant Garamond",var(--serif);font-size:1.3em;line-height:1.85;color:#5a3340;text-align:left}
.paper::before{content:"";position:absolute;inset:10px;border:1px solid #e9c9b6;border-radius:6px;pointer-events:none}
.paper::after{content:"♥";position:absolute;top:-30px;left:50%;transform:translateX(-50%);width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-size:26px;color:#ffe3ec;background:radial-gradient(circle at 35% 30%,#f2678d,#c42a56 72%);box-shadow:0 6px 16px #c42a5666,inset 0 -3px 6px #0003}
.paper p{opacity:0;transform:translateY(16px);transition:opacity 1.2s,transform 1.2s;margin:0 0 1.3em}
.paper p.in{opacity:1;transform:none}
.paper .salute{font-family:"Great Vibes",cursive;font-size:2.6em;line-height:1.2;color:var(--rose);text-align:center;margin-bottom:.8em}
.paper .salute::after{content:"❦";display:block;font-family:serif;font-size:.4em;color:#dba7b8;margin-top:.4em}
.paper .pull{text-align:center;font-style:italic;font-size:1.12em;color:#b23a62;padding:.9em 0;margin:1.6em 0;border-top:1px solid #efcfd8;border-bottom:1px solid #efcfd8}
.paper .names{text-align:center;font-family:"Great Vibes",cursive;font-size:1.9em;line-height:1.4;color:var(--rose)}
.paper .hanshika{text-align:center;font-family:"Great Vibes",cursive;font-size:3.2em;line-height:1.1;color:var(--rose);margin-top:.3em}
.paper .closing{text-align:center;font-family:"Great Vibes",cursive;font-size:2.1em;color:#8a4b3a;margin-top:1em}
.letter-photo{position:relative;border-radius:2px}
.letter-photo::before{content:"";position:absolute;top:-10px;left:50%;width:60px;height:18px;margin-left:-30px;background:#ffd23fa8;transform:rotate(-3deg)}
.sign{font-family:"Great Vibes",cursive;font-size:1.5em;color:#a86a58}
#final h2{color:var(--rose)}
@media(max-width:520px){.paper{padding:72px 24px 44px;font-size:1.18em}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}html{scroll-behavior:auto}#hearts{display:none}.paper p{opacity:1;transform:none}}
</style>
</head>

I don't even know where to begin, because no matter how much I write, it never feels like enough to explain what you mean to me.

I made this little website because I wanted to give you something different. Something that would make you smile, laugh, roll your eyes at me a few times, and maybe think, 'What is wrong with this boy?' 😭

And honestly, that would be a pretty accurate description of me.

But behind all the silly jokes, ridiculous buttons, and attempts to annoy you, there are things I really want you to know.

Let's start with your eyes. Those big, beautiful eyes. I swear I could get lost in them and not even look for the way out.(Just wanna drown in them and get lost)

And the way you blush when I look at you. You try to hold the eye contact, then you give up, cover your face, or hide it in my chest. That is my favorite thing ever. You have no idea what that does to me. 🙈

Then there's you in traditional wear. Effortless. You don't even try, and you still look like the prettiest thing I've ever seen. And that white powder you put on your head... ufff. I'm not okay. It pulls me in every single time. 😭

{{TRADITIONAL_PHOTOS}}

And your energy. You are so full of life, so energetic, that just being around you makes me energetic too. You walk in and the whole mood changes. I love that about you.

You're also so caring, and I feel lucky that you're in my life. You notice things. Little things that most people miss, like my mood, my silence, a change in my voice. You notice, and you care. I'm going to try my best to care for you as much as you care for the people around you, because you deserve that and more.

And I love how you can be mature and childish at the same time. One minute you're handling things like a grown-up, and the next you're being the cutest little kid. It's surprising, and it's so good. Never lose either side of you.

Now let me be a little shy for a second, because I can't forget our kiss. When I held your waist and pulled you in, and your lips met mine, it felt so good, so different, and so special. And I'm still happy that I got to be your first kiss. 😏 (Yes, I'm going to tease you about it forever.)

I can't promise I'll never annoy you. You've already seen the evidence on this website. 😭

I hope you never forget how special you are. I hope you keep chasing what makes you happy and believing in yourself when things get hard. You don't have to be perfect. You don't have to have everything figured out. And I hope you give yourself the same love and understanding that you give everyone else.

Today is about you. Your happiness, your dreams, your beautiful little existence, and everything that makes you who you are.

We don't know what the future holds, but let's just go with the flow and enjoy every moment together.

You are loved. You are appreciated. You matter. And today, tomorrow, and on all the ordinary days in between, I hope you never forget that.

I love you, my darling. My thanga maile. My sami. My love. My dear. My darling.

And last but not least, my Hanshika.

I fall in love with you a little more every single time I see you. ❤️

Happy Birthday, my favorite person.`,
    signoff:"— Your favorite idiot. 💗", madeWith:"💗 Made with love, just for you. ❤️"
  },
  final:{l1:"Happy Birthday, my love. ❤️",l2:"Out of all the things I could make, I wanted to make something that reminds you how special you are to me.",l3:"Thank you for being my favorite person to annoy.",btn:"REPLAY OUR LITTLE ADVENTURE ↻"},
  widgets:{
    w1:[
      {type:"chain",btn:"Click for a compliment ❤️",steps:[["You’re beautiful.","Tell me something I don’t know."],["Wow. Confidence level: dangerously high.","Okay, okay…"],["Anyway, you’re still beautiful. Unfortunately for you, I’m going to keep reminding you.",null]]},
      {type:"kiss",btn:"Click for a kiss 💋",a:"Virtual kiss delivered successfully.",b:"Physical delivery pending. Contact your boyfriend for further details. with specific location "}
    ],
    w2:[
      {type:"choice",btn:"Am I annoying? 🥺",options:[["Yes.","That’s a very hurtful accusation from someone who voluntarily keeps talking to me."],["VERY.","Noted. Filing a formal complaint against myself."],["You already know the answer.","I do. And I’m choosing to stay anyway. Bold."]]},
      {type:"chain",btn:"Do you love me? ❤️",steps:[["Wrong question, missy. THIS IS YOUR BIRTHDAY WEBSITE.","Fine, ask again"],["But since you asked… I love you. Now stop distracting yourself and continue.",null]]}
    ],
    w3:[
      {type:"leave",btn:"I want to leave.",a:"LEAVE? After all the emotional and financial investment that went into these pixels?",stay:"Okay, I’ll stay."}
    ]
  }
};
/* ============ ENGINE ============ */
const $=id=>document.getElementById(id);
const C=CONFIG, RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};

(function(){if(RM)return;const h=$("hearts"),s=["💗","💕","🩷","✨"];for(let i=0;i<14;i++){const e=el("span","",s[i%4]);e.style.left=Math.random()*100+"%";e.style.fontSize=14+Math.random()*22+"px";e.style.animationDuration=12+Math.random()*14+"s";e.style.animationDelay=-Math.random()*20+"s";h.append(e)}})();

const O=C.opening;
$("t-title").textContent=O.title;$("t-sub").textContent=O.subtitle;$("t-body").textContent=O.body;
$("b-open").textContent=O.openBtn;$("b-trust").textContent=O.trustBtn;$("b-in").textContent=O.letMeIn;
$("b-open").onclick=()=>{$("open-reply").textContent=O.openReply;$("b-in").hidden=false;$("b-in").textContent="Continue 💗"};
$("b-trust").onclick=()=>{$("open-reply").textContent=O.trustReply;$("b-in").hidden=false;$("b-in").textContent=O.letMeIn};
$("b-in").onclick=()=>$("w1").scrollIntoView({behavior:RM?"auto":"smooth"});

function flyHeart(from){if(RM)return;const r=from.getBoundingClientRect(),h=el("div","conf","💋");h.style.left=r.left+r.width/2+"px";h.style.top=r.top+"px";h.style.fontSize="40px";h.style.animation="flyup 1.4s ease-out forwards";document.body.append(h);setTimeout(()=>h.remove(),1500)}
document.head.append(Object.assign(el("style"),{textContent:"@keyframes flyup{to{transform:translateY(-220px) scale(1.8);opacity:0}}"}));
function build(box,w){
  const wrap=el("div","w"),reply=el("div","reply");reply.setAttribute("aria-live","polite");
  const b=el("button","",w.btn);wrap.append(b);const act=el("div");wrap.append(reply,act);
  if(w.type==="chain"){let i=0;const run=()=>{const [t,next]=w.steps[i];reply.textContent=t;act.textContent="";b.hidden=true;if(next){const n=el("button","alt",next);n.onclick=()=>{i++;run()};act.append(n);n.focus()}};b.onclick=run}
  if(w.type==="kiss")b.onclick=()=>{flyHeart(b);reply.textContent=w.a;act.textContent=w.b;act.className="sub"};
  if(w.type==="choice")b.onclick=()=>{b.hidden=true;w.options.forEach(([l,r])=>{const o=el("button","alt",l);o.onclick=()=>{reply.textContent=r;act.textContent=""};act.append(o)})};
  if(w.type==="leave")b.onclick=()=>{b.hidden=true;reply.textContent=w.a;const s=el("button","",w.stay);s.onclick=()=>{reply.textContent="";s.remove();b.hidden=false};act.append(s)};
  box.append(wrap)
}
for(const k of ["w1","w2","w3"])C.widgets[k].forEach(w=>build($(k),w));

const Q=C.quiz;$("q-title").textContent=Q.title;
function showQ(i){const box=$("q-box");box.textContent="";
  if(i>=Q.questions.length){box.append(el("h2","",Q.doneTitle),el("p","reply",Q.doneText));return}
  const q=Q.questions[i];box.append(el("p","sub",q.q));const o=el("div","opts"),fb=el("div","reply");
  q.o.forEach(([l,f])=>{const b=el("button","alt",l);b.onclick=()=>{o.remove();fb.textContent=f;const n=el("button","",i+1<Q.questions.length?"Next question":"See my result");n.onclick=()=>showQ(i+1);box.append(n);n.focus()};o.append(b)});
  box.append(o,fb)}
showQ(0);

$("g-title").textContent=C.photos.title;
const lb=$("lb");
const vid=p=>{const v=el("video","ph");v.src=p.video;if(p.poster)v.poster=p.poster;v.controls=true;v.playsInline=true;v.preload="metadata";return v};
const mkP=p=>{if(p.video){const v=p.poster?Object.assign(el("img","ph"),{src:p.poster,alt:p.caption}):Object.assign(el("video","ph"),{src:p.video+"#t=0.5",muted:true,preload:"metadata"});v.onerror=()=>v.replaceWith(el("div","ph","🎬"));return v}
  if(p.src){const i=el("img","ph");i.src=p.src;i.alt=p.caption;i.onerror=()=>i.replaceWith(el("div","ph","📷"));return i}return el("div","ph","📷")};
function showChap(ci){const ch=C.photos.chapters[ci];
  [...$("g-tabs").children].forEach((t,i)=>{t.classList.toggle("on",i===ci);t.setAttribute("aria-selected",i===ci)});
  $("g-intro").textContent=ch.intro||"";const g=$("g-grid");g.textContent="";
  ch.items.forEach(p=>{const b=el("button","polaroid");b.setAttribute("aria-label","Open: "+p.caption);b.append(mkP(p),el("span","cap",(p.video?"🎬 ":"")+p.caption));
    b.onclick=()=>{$("lb-img").textContent="";$("lb-img").append(p.video?vid(p):mkP(p));$("lb-cap").textContent=p.caption;lb.showModal()};g.append(b)})}
C.photos.chapters.forEach((ch,i)=>{const t=el("button","alt tab",ch.emoji+" "+ch.name);t.setAttribute("role","tab");t.onclick=()=>showChap(i);$("g-tabs").append(t)});
showChap(0);
$("lb-x").onclick=()=>lb.close();lb.onclick=e=>{if(e.target===lb)lb.close()};

const G=C.goofy;$("gf-title").textContent=G.title;$("gf-intro").textContent=G.intro;
const gbs=[],tilt=()=>gbs.forEach(b=>b.style.setProperty("--r",(Math.random()*8-4).toFixed(1)+"deg"));
G.items.forEach(p=>{const b=el("button","gf");let m;
  if(p.video){m=p.poster?Object.assign(el("img","ph"),{src:p.poster,alt:p.caption}):Object.assign(el("video","ph"),{src:p.video+"#t=0.5",muted:true,preload:"metadata"});
    m.onerror=()=>m.replaceWith(el("div","ph","🎬"));
    const w=el("div");w.style.position="relative";w.append(m,Object.assign(el("span","",""),{textContent:"▶",style:"position:absolute;inset:0;display:grid;place-items:center;font-size:40px;color:#fff;text-shadow:0 2px 8px #0008;pointer-events:none"}));m=w}
  else if(p.src){m=el("img","ph");m.src=p.src;m.alt=p.caption;m.onerror=()=>m.replaceWith(el("div","ph","🤪"))}
  else m=el("div","ph","🤪");
  b.append(m,el("span","lvl",(p.video!==undefined?"🎬 ":"")+"Goofy level: "+"🤪".repeat(p.level||3)),el("span","cap",p.caption));
  b.onclick=()=>{b.classList.toggle("open");if(p.video){$("lb-img").textContent="";$("lb-img").append(vid(p));$("lb-cap").textContent=p.caption;lb.showModal()}};
  gbs.push(b);$("gf-grid").append(b)});
lb.addEventListener("close",()=>{$("lb-img").textContent=""});
tilt();
let allOpen=false;$("gf-all").textContent=G.revealAll;$("gf-shuf").textContent=G.shuffle;
$("gf-all").onclick=()=>{allOpen=!allOpen;gbs.forEach(b=>b.classList.toggle("open",allOpen));$("gf-all").textContent=allOpen?G.hideAll:G.revealAll};
$("gf-shuf").onclick=()=>{tilt();const g=$("gf-grid"),a=[...g.children].sort(()=>Math.random()-.5);a.forEach(x=>g.append(x))};

$("n-title").textContent=C.envelopes.title;
C.envelopes.items.forEach(e=>{const b=el("button","env",e.label);const m=el("div","msg",e.text);b.append(m);b.setAttribute("aria-expanded","false");b.onclick=()=>{const o=b.classList.toggle("open");b.setAttribute("aria-expanded",o)};$("n-row").append(b)});

const R=C.reasons;$("r-title").textContent=R.title;
const card=(t,m,cls)=>{const b=el("button","card "+(cls||""),t);b.append(el("div","msg",m));b.onclick=()=>b.classList.toggle("open");$("r-row").append(b)};
R.items.forEach(r=>card(r.t,r.m));card(R.finalTitle,R.finalText,"big");
document.querySelector(".card.big").addEventListener("click",e=>{e.currentTarget.querySelector(".msg").style.display="block"});

const L=C.love;$("l-title").textContent=L.title;$("l-go").textContent=L.btn;
let timer;
$("l-go").onclick=()=>{clearInterval(timer);$("l-go").hidden=true;const bar=$("l-bar"),m=$("l-meter"),pc=$("l-pct"),msg=$("l-msg");let v=0,si=0;m.classList.remove("hot");pc.classList.remove("shake");msg.textContent="";
  timer=setInterval(()=>{v+=v<100?4:v<500?12:25;if(v>1000)v=1000;pc.textContent=v+"%";bar.style.width=Math.min(v,100)+"%";
    if(v>=200)m.classList.add("hot");
    while(si<L.stages.length&&v>=L.stages[si][0]){msg.textContent=L.stages[si][1];si++}
    if(v>=500)pc.classList.add("shake");
    if(v>=1000){clearInterval(timer);setTimeout(()=>{pc.classList.remove("shake");pc.textContent="ERROR";msg.textContent=L.error+" "+L.after;$("l-go").textContent=L.replay;$("l-go").hidden=false},900)}},RM?5:90)};

const K=C.cake;$("c-title").textContent=K.title;$("c-blow").textContent=K.blow;$("c-relight").textContent=K.relight;
for(let i=0;i<K.candles;i++){const c=el("div","candle");c.append(el("div","flame"));$("c-candles").append(c)}
function confetti(){if(RM)return;const s=["🎉","💗","✨","🎊","🩷"];for(let i=0;i<40;i++){const c=el("div","conf",s[i%5]);c.style.left=Math.random()*100+"vw";c.style.fontSize=16+Math.random()*20+"px";c.style.animationDelay=Math.random()*.8+"s";document.body.append(c);setTimeout(()=>c.remove(),4200)}}
$("c-blow").onclick=()=>{$("c-cake").classList.add("out");$("c-blow").hidden=true;$("c-relight").hidden=false;$("c-after").hidden=false;$("c-hb").textContent=K.hb;$("c-wish").textContent=K.wish;confetti()};
$("c-relight").onclick=()=>{$("c-cake").classList.remove("out");$("c-blow").hidden=false;$("c-relight").hidden=true;$("c-after").hidden=true};

const T=C.transition,trl=$("tr-lines"),tb=$("tr-btn");tb.textContent=T.btn;
T.lines.forEach(t=>trl.append(el("div","line",t)));
let started=false;
new IntersectionObserver((es,ob)=>{if(started||!es[0].isIntersecting)return;started=true;ob.disconnect();
  document.body.classList.add("calm");const ls=[...trl.children],gap=RM?0:2600;
  ls.forEach((l,i)=>setTimeout(()=>l.classList.add("show"),600+i*gap));
  setTimeout(()=>{tb.classList.add("show");tb.focus({preventScroll:true})},600+ls.length*gap)},{threshold:.6}).observe($("trans"));
tb.style.pointerEvents="auto";

/* letter */
const LT=C.letter,paper=$("paper");
if(LT.heading)paper.append(el("h2","",LT.heading));
if(LT.intro)paper.append(el("p","intro",LT.intro));
const parts=LT.text.split(/\n\s*\n/);
parts.forEach((p,i)=>{
  if(p==="{{TRADITIONAL_PHOTOS}}"){
    const photos=el("div","letter-photos");
    LT.photos.forEach(photo=>{
      const frame=el("figure","letter-photo");
      if(photo.src){frame.append(Object.assign(el("img"),{src:photo.src,alt:photo.alt}))}
      else{frame.append(el("div","placeholder","Add photo"))}
      frame.append(el("figcaption","",photo.caption));
      photos.append(frame);
    });
    paper.append(photos);return;
  }
  const e=el("p","",p);
  if(i===0)e.className="salute";
  else if(i===parts.length-1)e.className="closing";
  else if(/^You are loved\./.test(p))e.className="pull";
  else if(/^I love you, my darling/.test(p))e.className="names";
  else if(/my Hanshika\.$/.test(p))e.className="hanshika";
  paper.append(e);
});
paper.append(el("div","sign",LT.signoff),el("div","sign",LT.madeWith));
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.15});
paper.querySelectorAll("p").forEach(p=>io.observe(p));

const F=C.final,fin=$("final");
fin.append(el("h2","",F.l1),el("p","",F.l2),el("p","",F.l3));
const rb=el("button","",F.btn);rb.onclick=()=>{location.hash="";location.reload()};fin.append(rb);
tb.onclick=()=>{document.body.classList.add("letter");$("final").style.display="block";scrollTo(0,0);paper.setAttribute("tabindex","-1");paper.focus({preventScroll:true})};
addEventListener("pageshow",()=>{if(!document.body.classList.contains("letter"))scrollTo(0,0)});
if("scrollRestoration" in history)history.scrollRestoration="manual";
</script>
</body>
</html>
